<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BFFs Forever | A Space for Girl Friendship</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>
    
    <!-- Background Music -->
    <audio id="bg-music" loop>
      <source src="./audio/bg_music.mpeg" type="audio/mpeg">
    </audio>
    <button id="music-toggle" class="music-btn glass-card" data-magnetic>
      <span class="music-icon">🎵</span>
      <span class="music-text">Play</span>
      <div class="music-waves">
        <span></span><span></span><span></span>
      </div>
    </button>
    
    <!-- Secret Question Overlay -->
    <div id="secret-gate" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 2, 20, 0.98); backdrop-filter: blur(20px); z-index: 10000; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.8s ease;">
      <div class="glass-card text-center tilt-card" style="padding: 3rem; max-width: 400px; width: 90%;">
        <h2 style="font-family: 'Playfair Display', serif; color: var(--primary-color); margin-bottom: 1rem; font-size: 2rem;">Secret Gate</h2>
        <p style="margin-bottom: 2rem; font-size: 1.2rem; color: #fff;">Me and you birthday date ?</p>
        <input type="text" id="secret-answer" placeholder="??" class="glass-input" style="text-align: center; font-size: 2rem; letter-spacing: 5px; font-weight: bold; padding: 1rem;" autocomplete="off">
        <p id="secret-error" style="color: #ff4757; margin-top: 1rem; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s;"></p>
      </div>
    </div>

    <!-- Floating Background Particles -->
    <canvas id="particle-canvas"></canvas>

    <!-- Navigation -->
    <nav class="navbar">
      <div class="logo">Soul<span>Sisters</span></div>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="bond.html">The Bond</a></li>
        <li><a href="memories.html">Memories</a></li>
        <li><a href="connect.html" class="btn-glow" data-magnetic>Connect</a></li>
      </ul>
    </nav>

    <!-- Hero Section -->
    <header id="home" class="hero">
      <div class="section-content">
        <div class="hero-bg-image"></div>
        <div class="hero-content" style="width: 100%; max-width: 360px; margin: 0 auto;">
          <div class="glass-card main-glass tilt-card" style="padding: 1rem; border-radius: 30px;">
            <video id="hero-video" src="./connect_video.mp4" controls playsinline style="width: 100%; height: auto; max-height: 70vh; border-radius: 20px; display: block; box-shadow: 0 10px 30px rgba(0,0,0,0.3); object-fit: cover;"></video>
          </div>
        </div>
        <div class="scroll-indicator">
          <div class="mouse"></div>
        </div>
      </div>
    </header>



    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
      <span class="lightbox-close">&times;</span>
      <div class="lightbox-content">
        <img id="lightbox-img" src="" alt="">
        <video id="lightbox-video" src="" controls autoplay loop style="display:none;"></video>
      </div>
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>



    <script type="module" src="./main.js"></script>
  </body>
</html>
